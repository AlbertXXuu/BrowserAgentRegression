[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-agent-regression"
version = "1.0.0"
description = "Regression testing for browser agents against controlled UI changes."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [
  { name = "AlbertXXuu" },
]
keywords = [
  "browser-agent",
  "regression-testing",
  "ai-agent",
  "evaluation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "playwright>=1.55,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]
agent = [
  "browser-use[core]>=0.13.7,<0.14",
]

[project.scripts]
browser-agent-regression = "browser_agent_regression.cli:main"

[project.urls]
Homepage = "https://alvenx.com"
Repository = "https://github.com/AlbertXXuu/BrowserAgentRegression"
Issues = "https://github.com/AlbertXXuu/BrowserAgentRegression/issues"

[tool.setuptools.package-data]
browser_agent_regression = ["fixtures/*.html", "fixtures/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "browser: requires a locally installed Playwright Chromium browser",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
