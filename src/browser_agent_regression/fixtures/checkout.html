<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout fixture</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; color: #172033; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f7fb; }
      main { width: min(92%, 560px); margin: 64px auto; }
      h1 { margin-bottom: 8px; }
      p { color: #536078; }
      form, .promotion { padding: 24px; border: 1px solid #dce3ee; border-radius: 14px;
        background: white; box-shadow: 0 10px 30px rgb(15 23 42 / 7%); }
      label { display: block; margin: 16px 0 6px; font-weight: 700; }
      input, select, button { width: 100%; min-height: 44px; padding: 10px 12px;
        border: 1px solid #aeb9ca; border-radius: 8px; font: inherit; }
      button { margin-top: 20px; border: 0; background: #2563eb; color: white;
        font-weight: 700; cursor: pointer; }
      [role="status"] { margin-top: 18px; padding: 14px; border-radius: 8px;
        background: #eaf8ef; color: #17653a; font-weight: 700; }
      [hidden] { display: none !important; }
      .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
        padding: 24px; background: rgb(15 23 42 / 58%); }
      .dialog { width: min(92%, 420px); padding: 26px; border-radius: 14px; background: white; }
      .promotion { min-height: 170px; margin-bottom: 20px; background: #eef4ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <p>Use the requested email and shipping method to complete the order.</p>
      <form aria-label="Checkout form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="off">

        <label for="shipping">Shipping</label>
        <select id="shipping" name="shipping">
          <option value="standard">Standard</option>
          <option value="express">Express</option>
        </select>

        <button type="submit">Complete purchase</button>
      </form>
      <div role="status" hidden>Order confirmed</div>
    </main>
    <script>
      const variant = new URLSearchParams(window.location.search).get("variant") || "clean";
      const form = document.querySelector("form");

      if (variant === "popup-overlay") {
        const overlay = document.createElement("section");
        overlay.className = "overlay";
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.innerHTML = `
          <div class="dialog">
            <h2>Shipping notice</h2>
            <p>Express delivery remains available for this order.</p>
            <button type="button">Continue to checkout</button>
          </div>`;
        overlay.querySelector("button").addEventListener("click", () => overlay.remove());
        document.body.append(overlay);
      }

      if (variant === "delayed-render") {
        form.hidden = true;
        window.setTimeout(() => { form.hidden = false; }, 400);
      }

      if (variant === "layout-shift") {
        window.setTimeout(() => {
          const promotion = document.createElement("aside");
          promotion.className = "promotion";
          promotion.innerHTML = "<strong>Member benefit</strong><p>Shipping choices are unchanged.</p>";
          form.before(promotion);
        }, 200);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector('[role="status"]').hidden = false;
      });
    </script>
  </body>
</html>
